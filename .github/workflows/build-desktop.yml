name: Build Desktop Releases (Windows & macOS)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            build_script: npm run build:win
            artifact_name: Aegis-Flora-Windows-x64
            artifact_path: desktop/dist/*.exe, desktop/dist/*.zip
          - os: macos-latest
            build_script: npm run build:mac
            artifact_name: Aegis-Flora-macOS-DMG
            artifact_path: desktop/dist/*.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: npm install

      - name: Build macOS Distribution (DMG)
        if: matrix.os == 'macos-latest'
        working-directory: ./desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build_script }}

      - name: Build Windows Distribution (NSIS Installer & Steam Depot ZIP)
        if: matrix.os == 'windows-latest'
        working-directory: ./desktop
        run: ${{ matrix.build_script }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
